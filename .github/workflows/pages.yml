# Publishes the DRMD AI Generator on GitHub Pages.
# After each change to DRMD-Generator.html on the main branch, the page is updated at
# https://punitharumilli.github.io/DRMD_Generator/

name: Publish on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - DRMD-Generator.html
      - .github/workflows/pages.yml
  # Allows a manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publication at a time; a running publication is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare the site
        run: |
          if [ ! -f DRMD-Generator.html ]; then
            echo "::error::DRMD-Generator.html was not found in the root of the repository."
            exit 1
          fi
          mkdir -p _site
          cp DRMD-Generator.html _site/index.html
          cp DRMD-Generator.html _site/DRMD-Generator.html

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v5
